<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — MR COIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --blue: #172f56;
            --blue-light: #60a5fa;
            --blue-dim: rgba(59, 130, 246, .1);
            --blue-border: rgba(59, 130, 246, .2);
            --green: #16a34a;
            --text: #1a1a1a;
            --muted: #6b7280;
            --bg2: #f8f9fa;
            --card-border: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: 'Poppins', sans-serif;
        }

        /* ── LOADER ── */
        #loader {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .5s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--blue);
            letter-spacing: 3px;
            animation: blink-pulse 1s ease-in-out infinite;
        }

        @keyframes blink-pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        /* ── NAVBAR ── */
        #navbar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            width: calc(100% - 40px);
            max-width: 1100px;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 100px;
            padding: 6px 24px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .07);
        }

        .navbar-logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .btn-nav-cta {
            background: var(--blue);
            color: #fff !important;
            font-weight: 700 !important;
            border-radius: 100px !important;
            padding: 8px 20px !important;
            font-size: .87rem !important;
            transition: background .2s, transform .2s;
            display: inline-block;
            text-decoration: none;
        }

        .btn-nav-cta:hover {
            background: var(--blue-light);
            transform: translateY(-1px);
        }

        /* ── MAIN CONTENT & WATERMARK ── */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 140px;
            padding-bottom: 60px;
            position: relative;
        }

        .page-watermark-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
        }

        .page-watermark-bg img {
            width: 65vw;
            max-width: 900px;
            height: auto;
            opacity: 0.10;
            object-fit: contain;
        }

        /* ── AUTH CARD ── */
        .auth-card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, .05);
            position: relative;
            z-index: 1;
        }

        .auth-input-group {
            position: relative;
        }

        .auth-icon-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blue);
            font-size: 1rem;
            pointer-events: none;
        }

        .auth-input {
            width: 100%;
            background: #f0f1f3;
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            padding: 13px 14px 13px 44px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            outline: none;
            transition: all .2s;
        }

        .auth-input:focus {
            border-color: var(--blue);
            background: #fff;
        }

        .btn-primary-custom {
            background: var(--blue);
            color: #fff;
            border-radius: 100px;
            padding: 13px 28px;
            font-weight: 700;
            font-size: .95rem;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background .2s, transform .2s;
        }

        .btn-primary-custom:hover {
            background: var(--blue-light);
            transform: translateY(-2px);
            color: #fff;
        }

        .form-label {
            font-size: .8rem;
            color: var(--muted);
            letter-spacing: .5px;
        }

        .auth-footer-text {
            font-size: 0.88rem;
            color: var(--muted);
        }

        .auth-footer-text a {
            color: var(--blue);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer-text a:hover {
            text-decoration: underline;
        }

        /* ── SCROLL REVEAL MATCH ── */
        [data-reveal] {
            opacity: 0;
            transition: opacity 0.7s ease, transform 0.7s ease;
            transform: translateY(32px);
        }

        [data-reveal].revealed {
            opacity: 1;
            transform: none !important;
        }

        @media (max-width: 767px) {
            .auth-card {
                padding: 30px 20px;
            }

            .login-wrapper {
                padding-top: 120px;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="loader-logo">MR COIN</div>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar" class="navbar">
        <div class="container-fluid px-0 d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-logo">
                <img src="/assets/logo.png" alt="Mr Coin Logo" />
            </a>
            <a class="btn-nav-cta" href="index.html">Back to Home</a>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="login-wrapper">
        <div class="page-watermark-bg">
            <img src="/assets/logo.png" alt="Mr Coin Watermark Layer" />
        </div>

        <div class="container d-flex justify-content-center">
            <div class="auth-card" data-reveal="up">

                <div class="text-center mb-4">
                    <h3 class="fw-800 mb-1" style="color: var(--blue);">Welcome Back</h3>
                    <p class="text-muted small">Log in to manage your trades and dynamic wallets.</p>
                </div>

                <form action="#" method="POST">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label class="form-label fw-600 text-uppercase">Email Address</label>
                        <div class="auth-input-group">
                            <span class="auth-icon-prefix"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="auth-input" placeholder="name@example.com" required
                                autocomplete="email" />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-600 text-uppercase mb-0">Password</label>
                            <a href="#" class="small text-decoration-none"
                                style="color: var(--blue); font-size: 0.78rem; font-weight: 600;">Forgot?</a>
                        </div>
                        <div class="auth-input-group">
                            <span class="auth-icon-prefix"><i class="fas fa-lock"></i></span>
                            <input type="password" class="auth-input" placeholder="••••••••" required
                                autocomplete="current-password" />
                        </div>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="mb-4 d-flex align-items-center">
                        <input type="checkbox" class="form-check-input mt-0 me-2 shadow-none" id="rememberMe"
                            style="border-color: var(--card-border); cursor: pointer;" />
                        <label class="form-check-label text-muted small select-none" for="rememberMe"
                            style="cursor: pointer; font-size: 0.85rem;">Keep me logged in</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-custom w-100 justify-content-center mb-4">
                        <i class="fas fa-sign-in-alt"></i> Sign In to Account
                    </button>
                </form>

                <div class="text-center auth-footer-text">
                    Don't have an account? <a href="signup.html">Create Account</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Loading Layer Control
        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
        });

        // Structural Entrance Animations
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('[data-reveal]');
            if (card) {
                setTimeout(() => card.classList.add('revealed'), 200);
            }
        });
    </script>

</body>

</html>
